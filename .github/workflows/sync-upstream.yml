name: Sync Upstream Config

# 每天 CST 02:00 自动同步上游配置 + RULE/ 下所有 list；也可手动触发
on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = CST 次日 02:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://yfamilys.com/config/shadowrocket_basic.conf
  BASIC_FILE: shadowrocket_basic.conf
  FINAL_FILE: shadowrocket_final.conf

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download upstream basic
        run: |
          set -uo pipefail
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --max-time 60 -o /tmp/upstream.conf "$UPSTREAM_URL"; then
              echo "下载成功（第 $i 次尝试）"
              ok=1
              break
            fi
            echo "第 $i 次下载失败，5 秒后重试..."
            sleep 5
          done
          if [ "$ok" = 0 ] || [ ! -s /tmp/upstream.conf ] || ! grep -q '\[Rule\]' /tmp/upstream.conf; then
            echo "::warning::上游下载失败或内容异常，跳过本次更新（保留旧配置）"
            exit 0
          fi
          cp /tmp/upstream.conf "$BASIC_FILE"

      - name: Sync RULE/ lists（自托管所有 yfamilys list）
        run: |
          mkdir -p RULE
          grep -oE 'https://yfamilys.com/rule/[A-Za-z0-9._-]+\.list' "$BASIC_FILE" | sort -u | while read url; do
            fname=$(basename "$url")
            if curl -fsSL --retry 3 --retry-all-errors --max-time 60 -o "RULE/$fname" "$url"; then
              echo "synced $fname"
            else
              echo "::warning::failed to sync $fname"
            fi
          done

      - name: Merge into final config
        run: python scripts/merge.py

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream + RULE lists $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "已同步上游配置 + RULE/ 下所有 list 并重新生成 final"

      - name: Summary
        run: |
          echo "### 同步结果" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "- 上游/RULE 有更新，已提交"  >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 全部无变化" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Shadowrocket 订阅链接：" >> "$GITHUB_STEP_SUMMARY"
          echo "  \`https://raw.githubusercontent.com/${{ github.repository }}/main/$FINAL_FILE\`" >> "$GITHUB_STEP_SUMMARY"
